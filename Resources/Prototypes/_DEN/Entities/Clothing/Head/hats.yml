## DINER

- type: entity
  parent: ClothingHeadHatChef
  id: ClothingHeadHatDinerTeal
  name: teal diner cap
  description: A hat that lets waiting customers know that you're not just dressed up nice, but instead, you're actually here to take their order.
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/diner_teal.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/diner_teal.rsi

- type: entity
  parent: ClothingHeadHatDinerTeal
  id: ClothingHeadHatDinerPink
  name: pink diner cap
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/diner_pink.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/diner_pink.rsi

- type: entity
  parent: ClothingHeadHatDinerTeal
  id: ClothingHeadHatDinerFastFood
  name: red diner cap
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/diner_fastfood.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/diner_fastfood.rsi

- type: entity
  parent: ClothingHeadHatBeret
  id: ClothingHeadHatParamedicBeret
  name: paramedic beret
  description: "A beret worn by emergency medical technicians and the like, adorned with a white cross."
  components:
  - type: Sprite
    sprite: _QB/Clothing/Head/Hats/paramedic_beret.rsi #qb
  - type: Clothing
    sprite: _QB/Clothing/Head/Hats/paramedic_beret.rsi #qb

# siren beret start
- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatParamedicSirenBeret
  name: salvation shako
  description: "A noisy beret used to indicate a medical emergency response. Requires batteries. Not actually a shako."
  components:
  - type: Sprite
    sprite: _QB/Clothing/Head/Hats/salvation_shako.rsi #qb
    layers:
      - state: icon
      - state: icon-light
        visible: false
        shader: unshaded
        map: [ "light" ]
  - type: Appearance
  - type: Clothing
    sprite: _QB/Clothing/Head/Hats/salvation_shako.rsi #qb
    equippedPrefix: off
  - type: ItemToggle
    predictable: false
    onUse: false
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_Impstation/Effects/Vehicle/ambulancesiren.ogg
      params:
        volume: -3
  - type: UseDelay
    delay: 1.0
  - type: ToggleClothing
    action: ActionToggleParamedicSirenBeret
  - type: ItemTogglePointLight
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
  - type: PointLight
    enabled: false
    radius: 1.4
    energy: 2
    color: deepskyblue
    netsync: false
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RotatingLight
    speed: 360
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
  - type: PowerCellDraw
    drawRate: 1
  - type: ToggleCellDraw

- type: entity
  parent: ClothingHeadHatParamedicSirenBeret
  id: ClothingHeadHatParamedicSirenBeretEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  parent: BaseToggleAction
  id: ActionToggleParamedicSirenBeret
  name: Toggle Paramedic Siren Beret
  description: Toggles the paramedic siren beret on and off.
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: BigItem
# siren beret end
