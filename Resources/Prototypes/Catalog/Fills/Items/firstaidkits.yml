#Entities found at entities/objects/specific/medical
- type: entity
  id: MedkitFilled
  suffix: Filled
  parent: Medkit
  components:
  - type: StorageFill
    contents:
      - id: Brutepack
      - id: Ointment
      - id: Gauze
      # - id: PillCanisterTricordrazine # QB - we don't need both tric and granib
      - id: PillCanisterGranibitulari # QB - Funkychem - tricordrazine variant
      # see https://github.com/tgstation/blob/master/code/game/objects/items/storage/firstaid.dm for example contents

- type: entity
  id: MedkitBurnFilled
  suffix: Filled
  parent: MedkitBurn
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: Ointment
          amount: 2
        - id: Tincture #IMP
        - id: PillCanisterKelotane
        - id: PillCanisterDermaline

