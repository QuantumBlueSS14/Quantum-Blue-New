  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          rolls: 3
          tableId: VarietyNanoBoyTable
        - id: NanoBoyBlockGame
          amount: 1
