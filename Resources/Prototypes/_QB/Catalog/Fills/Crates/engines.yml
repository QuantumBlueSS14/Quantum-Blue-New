- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringTEGParts
  name: thermo-electric generator crate
  description: Parts for building a thermo-electric generator.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: TEGCenterFlatpack
        - id: TEGCirculatorFlatpack
          amount: !type:ConstantNumberSelector
            value: 2

- type: entityTable
  id: ParticleAcceleratorPartsFill
  table: !type:AllSelector
    children:
    - id: ParticleAcceleratorControlBoxFlatpack
    - id: ParticleAcceleratorEndCapFlatpack
    - id: ParticleAcceleratorFuelChamberFlatpack
    - id: ParticleAcceleratorPowerBoxFlatpack
    - id: ParticleAcceleratorEmitterForeFlatpack
    - id: ParticleAcceleratorEmitterStarboardFlatpack
    - id: ParticleAcceleratorEmitterPortFlatpack

- type: entityTable
  id: SingularityAssemblyFill
  table: !type:AllSelector
    children:
    - id: SingularityGeneratorFlatpack
    - id: RadiationCollectorFlatpack
      amount: !type:RangeNumberSelector
        range: 8, 12
    - id: PlasmaTankFilled
      amount: !type:ConstantNumberSelector
        value: 12

- type: entityTable
  id: TeslaAssemblyFill
  table: !type:AllSelector
    children:
    - id: TeslaGeneratorFlatpack
    - id: TeslaCoilFlatpack
      amount: !type:RangeNumberSelector
        range: 4, 6
    - id: TeslaGroundingRodFlatpack
      amount: !type:ConstantNumberSelector
        value: 4

- type: entityTable
  id: SupermatterShardAssemblyFill
  table: !type:AllSelector
    children:
    - id: SupermatterShard
    - id: RadiationCollectorFlatpack
      amount: !type:RangeNumberSelector
        range: 4, 6
    - id: PlasmaTankFilled
      amount: !type:ConstantNumberSelector
        value: 6

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringSingularityParts
  name: singularity assembly crate
  description: Parts for setting up a singularity engine.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:GroupSelector
        children:
        - !type:NestedSelector
          tableId: SingularityAssemblyFill

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringSingularityPartsPA
  name: singularity assembly crate
  suffix: Particle Accelerator
  description: Parts for setting up a singularity engine.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:GroupSelector
        children:
        - !type:NestedSelector
          tableId: SingularityAssemblyFill
        - !type:NestedSelector
          tableId: ParticleAcceleratorPartsFill

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringTeslaParts
  name: tesla assembly crate
  description: Parts for setting up a tesla engine.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:GroupSelector
        children:
        - !type:NestedSelector
          tableId: TeslaAssemblyFill

- type: entity
  parent: CrateEngineeringSecure
  id: CrateEngineeringTeslaPartsPA
  name: tesla assembly crate
  suffix: Particle Accelerator
  description: Parts for setting up a tesla engine.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:GroupSelector
        children:
        - !type:NestedSelector
          tableId: TeslaAssemblyFill
        - !type:NestedSelector
          tableId: ParticleAcceleratorPartsFill

- type: entity
  id: CrateEngineeringSupermatterShard
  parent: CrateEngineeringSupermatterSecure
  name: supermatter shard crate
  description: A specialized crate immune to the supermatter that contains a supermatter shard. Requires Engineering access to open.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:GroupSelector
        children:
        - !type:NestedSelector
          tableId: SupermatterShardAssemblyFill
