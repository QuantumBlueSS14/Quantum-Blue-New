- type: entity
  parent: BasePlushie
  id: PlushieValid
  name: syndicate agent plushie
  description: You are valid. It's good to be bad. You're bad and that's good.
  components:
  - type: Sprite
    sprite: _QB/Objects/Fun/Plushies/valid.rsi
    state: icon
  - type: EmitSoundOnUse
    sound: &PlushieValidSound
      collection: sparks # imitate EMAG
  - type: EmitSoundOnLand
    sound: *PlushieValidSound
  - type: EmitSoundOnActivate
    sound: *PlushieValidSound
  - type: EmitSoundOnTrigger
    sound: *PlushieValidSound
  - type: EmitSoundOnCollide
    sound: *PlushieValidSound
  - type: Edible
    useSound:
      path: /Audio/Voice/Human/malescream_1.ogg
      params:
        volume: -8
  - type: MeleeWeapon # imitate GOTNS
    wideAnimationRotation: -135
    autoAttack: true
    attackRate: 4
    damage:
      types:
        Blunt: 1
    soundHit:
      collection: Punch
  - type: FoodSequenceElement
    entries:
      CottonBurger: ValidPlushie
  - type: FlavorProfile
    flavors:
      - validhunting
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Fiber
          Quantity: 9
        - ReagentId: Stimulants
          Quantity: 1
