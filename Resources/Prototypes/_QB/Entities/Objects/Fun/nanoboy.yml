- type: entity
  parent: NanoBoy
  id: NanoBoyBlockGame # TODO remove when cartridges added
  description: Nanotrasen's legally distinct nostalgic handheld video game system, featuring the popular NT Block Game! It is so authentic that the screen is a swampy, poisonous green color.
  suffix: ""
  components:
  - type: BlockGameArcade
  - type: ActivatableUI
    key: enum.BlockGameUiKey.Key
  - type: ActivatableUIRequiresPowerCell
  - type: UserInterface
    interfaces:
      enum.BlockGameUiKey.Key:
        type: BlockGameBoundUserInterface
  - type: Vocalizer
    minVocalizeInterval: 1m # Arcades are noisy
    maxVocalizeInterval: 4m
    hideChat: true
  - type: DatasetVocalizer
    dataset: BlockGameAds
  - type: SpeakOnUIClosed
    pack: BlockGameGoodbyes

