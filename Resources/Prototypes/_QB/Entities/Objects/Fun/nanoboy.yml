
- type: entity
  parent: BaseItem
  id: NanoBoyUnpowered
  name: NanoBoy Color
  suffix: Always Powered
  description: Infinite power, but no games...
  components:
  - type: Sprite
    sprite: _QB/Objects/Fun/nanoboy.rsi
    layers:
    - state: base
  - type: Icon
    sprite: _QB/Objects/Fun/nanoboy.rsi
    state: icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: Appearance
  - type: ItemToggle
    predictable: false
    onUse: false
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
  # Cartridge logic - TODO when someone smart wants to
  #- type: ContainerContainer
  #  containers:
  #    Cartridge-Slot: !type:ContainerSlot {}
  #    program-container: !type:Container
  #- type: CartridgeLoader
  #  uiKey: enum.PdaUiKey.Key
  #  preinstalled: # needs a cartridge inside to play it
  #  cartridgeSlot:
  #    priority: -1
  #    name: device-pda-slot-component-slot-name-cartridge
  #    ejectSound: /Audio/Machines/id_swipe.ogg
  #    insertSound: /Audio/Machines/id_insert.ogg
  #    whitelist:
  #      components:
  #        - Cartridge
  # Arcade Logic - will need modified when cartridges added
  - type: Speech
    speechVerb: Robotic
    speechSounds: Vending
  - type: TypingIndicator
    proto: robot
  - type: SpookySpeaker
    messageSet: SpookySpeakerMessagesGeneric
    speakChance: 0.2
  - type: SpamEmitSoundRequirePower
  - type: SpamEmitSound
    minInterval: 30
    maxInterval: 90
    sound:
      collection: ArcadeNoise
      params:
        volume: -8
        maxDistance: 10
        variation: 0.05

- type: entity
  parent: [ NanoBoyUnpowered, PowerCellSlotSmallItem ]
  id: NanoBoy
  suffix: ""
  components:
  - type: PowerCellDraw
    drawRate: 1
    useCharge: 0
  - type: ToggleCellDraw

- type: entity
  parent: NanoBoy
  id: NanoBoyEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

