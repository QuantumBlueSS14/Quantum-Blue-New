
- type: entity
  name: butter on a stick
  parent: FoodMealBase
  id: FoodMealButterOnAStick
  description: For those refined clientele that like to eat butter without getting their hands greasy.
  components:
  - type: Edible
    trash:
    - FoodKebabSkewer
  - type: FlavorProfile
    flavors:
      - butter
  - type: Sprite
    sprite: Objects/Consumable/Food/meals.rsi
    state: butteronastick
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Butter
          Quantity: 15
  - type: Tag
    tags:
    - FoodSnack

- type: entity
