  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Revolvers/fitz.rsi
  - type: Item
    size: Small # 1x2
    shape:
    - 0,0,1,0
    storedOffset: 0,0
  - type: Gun # less extreme than snubbed
