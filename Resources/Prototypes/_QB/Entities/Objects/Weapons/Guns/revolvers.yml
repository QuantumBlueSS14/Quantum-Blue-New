- type: entity
  name: trinity
  parent: BaseWeaponRevolver
  id: WeaponRevolverTrinity
  description: Purge your sins done in honor of His name. Uses .45 magnum ammo. 
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Revolvers/faith.rsi
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Revolvers/faith.rsi
  - type: Item
    size: Small # 1x2
    shape:
    - 0,0,1,0
  - type: Gun
    minAngle: 5
    maxAngle: 30
    angleIncrease: 5
    angleDecay: 5
    selectedMode: Burst
    burstFireRate: 3
    shotsPerBurst: 3
    burstCooldown: 1
    fireRate: 3
    availableModes:
    - Burst
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
  - type: GunDamage
    damage:
      types:
        Piercing: 20 # should crit if all 3 land, unless its AP
    damageSpecific:
      DamageVariable:
        types:
          Piercing: 0
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - CartridgeMagnum
        - SpeedLoaderMagnum
    proto: CartridgeMagnumHoly
    capacity: 3 # bible reference
    chambers: [ True, True, True ]
    ammoSlots: [ null, null, null ]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
  - type: UseDelay
    delay: 0.66
  - type: StaticPrice
    price: 316 # bible reference
