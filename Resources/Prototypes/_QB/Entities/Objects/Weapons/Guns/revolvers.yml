# deltaV revolvers
- type: entity
  name: snubbed .45
  parent: BaseWeaponRevolver
  id: WeaponRevolverSnub
  description: An old and reliable revolver, modified to be more easily concealed. Uses .45 magnum ammo.
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Revolvers/webleysnubnose.rsi
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Revolvers/webleysnubnose.rsi
  - type: Item
    size: Small # 1x2
    shape:
    - 0,0,1,0
    storedOffset: 0,0
  - type: Gun
    selectedMode: SemiAuto
    minAngle: 5
    maxAngle: 30
    angleIncrease: 25
    angleDecay: 5
    fireRate: 2.5 # high ROF for high variation
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
  - type: GunDamage
    damage:
      types:
        Piercing: 25 #35 pierce for .45 magnum
    damageSpecific:
      DamageVariable:
        types:
          Piercing: 0
  - type: UseDelay
    delay: 0.66

