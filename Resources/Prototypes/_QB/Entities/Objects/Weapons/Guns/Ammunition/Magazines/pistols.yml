# .45 pistol magazines

- type: entity
  id: MagazineMagnumStun
  name: pistol magazine (.45 magnum stun)
  parent: BaseMagazineMagnum
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumStun
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-mag
      - state: inhand-left-stripe
        color: "#4477bc"
      right:
      - state: inhand-right-mag
      - state: inhand-right-stripe
        color: "#4477bc"
