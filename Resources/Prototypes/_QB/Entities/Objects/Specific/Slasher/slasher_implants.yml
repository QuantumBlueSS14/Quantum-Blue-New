  - type: PointLight
    enabled: false
    radius: 3
    energy: 2
    color: red
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: Tag
    tags:
    - SubdermalImplant
    - HideContextMenu
