- type: entity
  id: DogTackleBase
  abstract: true
  components:
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Blunt: 0
    soundHit:
      path: /Audio/Animals/dog_bark1.ogg
  - type: StaminaDamageOnHit
    damage: 15
  - type: HTN
    rootTask:
      task: MeleeDogCompound

- type: entity
  name: mosquito
  parent: [ SimpleMobBase, FlyingMobBase]
  id: MobMosquito
  description: EEEEeeeeEEEEEEEEeeEEE
  components:
  - type: VentCrawler
    enterDelay: 1
  - type: Item
    size: Tiny
  - type: CanEscapeInventory
    baseResistTime: 2
  - type: CombatMode
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcThrust
    soundHit:
      path: /Audio/Weapons/star_hit.ogg
    damage:
      types:
        Bloodloss: 0.1
  # Syringing abilities
  - type: Injector
    activeModeProtoId: DropperDrawMode
    allowedModes:
    - DropperDrawMode
    - DropperInjectMode
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 3
        reagents:
        - ReagentId: Histamine #Does almost nothing but make you itch
          Quantity: 3
      injector:
        maxVol: 5
        reagents:
        - ReagentId: Blood
          Quantity: 5
  - type: MeleeChemicalInjector
    solution: melee
    transferAmount: 1
  - type: SolutionRegeneration
    solution: melee
    duration: 15 #regen 1u every 15 seconds
    generated:
      reagents:
      - ReagentId: Histamine
        Quantity: 1
  - type: MovementSpeedModifier
    baseWalkSpeed : 3
    baseSprintSpeed : 7
  - type: GhostRole
    makeSentient: true
    allowSpeech: false
    allowMovement: true
    name: ghost-role-information-mosquito-name
    description: ghost-role-information-mosquito-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
  - type: GhostTakeoverAvailable
  - type: Emoting
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      sprite: _QB/Mobs/Animals/mosquito.rsi
      state: mosquito
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.1 # making them smaller makes them die of heat...?
        density: 30 # making them less dense makes them die of heat...?
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      1: Dead
  - type: TriggerOnMobstateChange
    mobState:
    - Dead
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Voice/Slime/slime_squish.ogg
      params:
        variation: 0.125
  - type: DamageStateVisuals
    states:
      Alive:
        Base: mosquito
      Dead:
        Base: dead
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: InsectBlood
        Quantity: 1
  - type: MobPrice
    price: 50
  - type: NPCRetaliation
  - type: FactionException
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Blunt
        damage: 5
      behaviors:
      - !type:GibBehavior
        recursive: false
  - type: AmbientSound
    enabled: true
    volume: -3
    range: 8
    sound:
      path: /Audio/_QB/Animals/mosquito.ogg
  - type: Tag
    tags:
    - Trash
    - MultitoolDefibrillatorTarget

- type: entity
  parent: MobMosquito
  id: MobMosquitoAngry
  name: mosquito
  description: EEEEeeeeEEEEEEEEeeEEE
  suffix: Angry
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: false
    allowMovement: true
    name: ghost-role-information-mosquito-name
    description: ghost-role-information-mosquito-description
    rules: ghost-role-information-freeagent-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound

- type: entity
  parent: MobMosquito
  id: MobMosquitoZombie
  name: mosquito
  description: EEEEeeeeEEEEEEEEeeEEE
  suffix: Admeme/Zombie
  components:
  - type: Zombie
  - type: GhostRole
    makeSentient: true
    allowSpeech: false
    allowMovement: true
    name: ghost-role-information-mosquito-name
    description: zombie-role-desc
    rules: zombie-role-rules
    mindRoles:
    - MindRoleGhostRoleTeamAntagonist
  - type: NpcFactionMember
    factions:
    - Zombie
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
