
# Security borg
- type: borgType
  id: security

  # Description
  dummyPrototype: BorgChassisSecurity

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleSecurity

  defaultModules:
  - BorgModuleSecurityPatrol
  - BorgModuleSecurityUtility

  radioChannels:
  - Science
  - Security

  lawset: SiliconPolice

  addComponents:
  - type: ShowMindShieldIcons
  - type: ShowCriminalRecordIcons

  # Visual
  clientComponents:
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    sprite: /Textures/_QB/Mobs/Silicon/chassis.rsi
    layers:
    - state: security
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: security_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: security_l
      shader: unshaded
      map: ["light","enum.BorgVisualLayers.LightStatus"]
      visible: false
  inventoryTemplateId: borgShort
  spriteBodyState: security
  spriteHasMindState: security_e
  spriteNoMindState: security_e_r
  spriteToggleLightState: security_l

  # Pet
  petSuccessString: petting-success-security-cyborg
  petFailureString: petting-failure-security-cyborg
