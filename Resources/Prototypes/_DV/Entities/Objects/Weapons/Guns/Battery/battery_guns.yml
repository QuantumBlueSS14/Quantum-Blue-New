- type: entity
  parent: [ BaseWeaponBattery, BaseGunWieldable, BaseSecurityContraband ]
  id: WeaponBeamCannon
  name: beam cannon
  description: "For when a single shot just isn't enough"
  components:
  - type: Sprite
    sprite: DeltaV/Objects/Weapons/Guns/Battery/beam_cannon.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-0
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: DeltaV/Objects/Weapons/Guns/Battery/beam_cannon.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/DeltaV/Weapons/Guns/Gunshots/beamcannon.ogg
    selectedMode: FullAuto
    fireRate: 15
    availableModes: FullAuto
  - type: Battery
    maxCharge: 3000
    startingCharge: 3000
  - type: HitscanBatteryAmmoProvider
    proto: BeamLaser
    fireCost: 10
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Appearance

- type: entity
  parent: BaseWeaponBattery
  id: WeaponBeamDevastator
  name: beam devastator
  description: A powerful energy weapon that fires multiple rapid laser beams per second
  components:
  - type: Item
    size: Ginormous
  - type: MultiHandedItem
  - type: ClothingSpeedModifier
    walkModifier: 0.7
    sprintModifier: 0.7
  - type: HeldSpeedModifier
  - type: Sprite
    sprite: DeltaV/Objects/Weapons/Guns/Battery/beam_devestator.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Gun
    selectedMode: FullAuto
    fireRate: 15
    availableModes: FullAuto
    soundGunshot:
      path: /Audio/DeltaV/Weapons/Guns/Gunshots/beamcannon.ogg
  - type: HitscanBatteryAmmoProvider
    proto: BeamDev
    fireCost: 600
  - type: Battery
    maxCharge: 300000
    startingCharge: 300000
  - type: Tag
    tags:
    - PowerCage

- type: entity
  parent: [ BaseItem, BaseGunWieldable, BaseSecurityContraband]
  id: WeaponSniperGamblagator
  name: Gamblagator
  description: A monstrously powerful laser rifle. Outfitted with a scope, it requires special capacitors to be fired.
  components:
  - type: Item
    size: Huge
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    sprite: _DV/Objects/Weapons/Guns/Snipers/gamblagator.rsi
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Snipers/gamblagator.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_DV/Weapons/Guns/Gunshots/gamblagatorshot.ogg
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: GamblagatorCapacitor
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - GamblagatorCartridge
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 5
    pvsIncrease: 0.5
  - type: GunRequiresWield
  - type: SpeedModifiedOnWield
    walkModifier: 0.75
    sprintModifier: 0.75
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
