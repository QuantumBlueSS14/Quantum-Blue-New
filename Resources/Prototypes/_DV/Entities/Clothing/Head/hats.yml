# Head of Security

- type: entity
  parent: [ ClothingHeadBase, BaseCommandContraband ]
  id: ClothingHeadHatHoshatDV
  name: head of security's campaign hat # imp edit - better name
  description: "There's a new sheriff in station."
  components:
  - type: Sprite
    sprite: _DV/Clothing/Head/Hats/hoshat.rsi
  - type: Clothing
    sprite: _DV/Clothing/Head/Hats/hoshat.rsi
  - type: Tag
    tags:
    - ClothMade
    - HamsterWearable
    - WhitelistChameleon

# Synthesis Specialist

- type: entity
  parent: [ClothingHeadBase, Tier1Contraband]
  id: ClothingHeadHatSurgcapCybersun
  name: surgical cap
  description: A surgical cap worn by members of Cybersun's biotechnology division. # imp caps fix
  components:
  - type: Sprite
    sprite: _DV/Clothing/Head/Hats/surgcap_cybersun.rsi
  - type: Clothing
    sprite: _DV/Clothing/Head/Hats/surgcap_cybersun.rsi

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatGnomeReal # QB rename to Real
  name: gnome hat
  description: For those that honor the first gnome in space, Gnome Chompsky. Still has a bit of magic that sparkles in its velvet sheen.
  components:
  - type: Sprite
    sprite: _DV/Clothing/Head/Hats/gnomehat.rsi
  - type: Clothing
    sprite: _DV/Clothing/Head/Hats/gnomehat.rsi
    clothingVisuals:
      head:
      - state: equipped
        offset: "0, 0.35"
  - type: EmbeddableProjectile # funny
    offset: -0.15,0.0
  - type: ThrowingAngle
    angle: 180
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PolygonShape
          vertices:
            - -0.40,-0.30
            - -0.30,-0.40
            - 0.40,0.30
            - 0.30,0.40
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Storage
    grid:
    - 0,0,0,1
    maxItemSize: Small
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Tag
    tags:
    - PetWearable
    - CorgiWearable
